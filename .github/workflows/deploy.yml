name: Deploy to Cloudflare

# Deploys automatically every time something is merged to main, and can still be run by hand
# from the Actions tab. This is the LIVE site: the Worker serves www.driftlineprovisions.com,
# the bare domain and the test address (see deploy/cloudflare.json), and migrations run against
# the production database. Remove the "push" trigger below to go back to deploying by hand only.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    # A hand-started run from any other branch would ship unreviewed code to the live site.
    if: github.ref == 'refs/heads/main'
    # To require an approval before each deploy, add yourself as a required reviewer under
    # Settings > Environments > production. Until then this only labels the run.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Same build and tests CI runs, so a broken build never reaches the site.
      - name: Build and test
        run: npm test

      # Same check as CI: a schema change without its migration must never reach production.
      - name: Check for schema drift
        run: |
          npm run db:generate
          if ! git diff --quiet --exit-code -- drizzle || [ -n "$(git ls-files --others --exclude-standard -- drizzle)" ]; then
            echo "::error::db/schema.ts and drizzle/ are out of sync. Run 'npm run db:generate' and commit the result."
            exit 1
          fi

      - name: Build for production
        run: DRIFTLINE_DEPLOY=production npm run build

      # A restore point taken right before migrations. D1 Time Travel keeps the history; this
      # records exactly where to go back to, in the run summary. No restore point, no deploy.
      - name: Record a database restore point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
          # Optional: a PRIVATE R2 bucket (never the photo bucket) to also keep a full SQL export in.
          D1_BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          config=dist/server/wrangler.json
          npx wrangler d1 time-travel info DB --json --config "$config" | tee time-travel.json
          bookmark=$(grep -oE '"bookmark" *: *"[^"]+"' time-travel.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)
          if [ -z "$bookmark" ]; then
            echo "::error::Couldn't get a D1 restore point, so nothing was migrated or deployed."
            exit 1
          fi
          worker=$(node -p 'require("./deploy/cloudflare.json").workerName')
          {
            echo "## Restore point before this deploy"
            echo ""
            echo "Database bookmark: \`$bookmark\`"
            echo ""
            echo "If this deploy breaks the site:"
            echo "- Put the previous code back: \`npx wrangler rollback --name $worker\`"
            echo "- Put the database back (loses anything written since): \`npx wrangler d1 time-travel restore DB --bookmark=$bookmark --config dist/server/wrangler.json\`, after \`DRIFTLINE_DEPLOY=production npm run build\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${D1_BACKUP_BUCKET:-}" ]; then
            file="d1-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}.sql"
            npx wrangler d1 export DB --remote --config "$config" --output "$file"
            npx wrangler r2 object put "$D1_BACKUP_BUCKET/d1/$file" --file "$file" --remote --config "$config"
            rm -f "$file"
            echo "- Full export: \`$D1_BACKUP_BUCKET/d1/$file\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Applies any new database migrations, then publishes the worker.
      - name: Migrate the database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
        run: |
          npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
          npx wrangler deploy --config dist/server/wrangler.json
